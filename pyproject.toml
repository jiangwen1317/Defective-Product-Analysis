# 仓库根级静态检查配置（三个子项目共享）
# 机械化 AGENTS.md / youhua.md 中可自动检查的规则子集：
#   - 公开函数必须有类型注解（AGENTS.md 二、三）
#   - 每个函数不超过 50 行（AGENTS.md 二；以语句数 50 为机械代理指标）
#   - 禁用 Any（AGENTS.md 三）
#   - 导入顺序：标准库 → 第三方 → 本地（AGENTS.md 五）
#   - 保留原始异常链 raise ... from e 等 bugbear 陷阱（AGENTS.md 四）
#   - 命名规范 snake_case / PascalCase（AGENTS.md 一）
# 运行方式（仓库根）：.venv\Scripts\python.exe -m ruff check .

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv", ".qoder", ".idea"]

[tool.ruff.lint]
select = [
    "ANN001",  # 函数参数缺少类型注解
    "ANN201",  # 公开函数缺少返回值类型注解
    "ANN401",  # 禁用 typing.Any
    "PLR0915", # 函数语句数超限（函数长度上限的机械代理）
    "I",       # 导入顺序：标准库 → 第三方 → 本地
    "B",       # bugbear：含 B904 异常链 raise ... from e、常见陷阱
    "N",       # pep8-naming：模块/类/函数/变量命名规范
]

[tool.ruff.lint.pep8-naming]
# Qt 框架强制的 camelCase 名称：QWidget 重写方法与 pyqtSignal 类属性，
# 无法改名，不属于存量基线豁免（per-file-ignores）范围
extend-ignore-names = ["eventFilter", "closeEvent", "dutClicked"]

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# 测试代码不受"公开函数必须有类型注解"约束（规范针对公开 API）
"**/tests/**" = ["ANN"]
"**/conftest.py" = ["ANN"]

# ---- 存量基线豁免（2026-07-29 引入检查时已存在的违规，随重构逐步收紧删除）----
# 只减不增由 tools/check_exemption_baseline.py 机械断言：对数（基线 6）与每对违规处数
# （BASELINE_VIOLATIONS 快照）双向比对，超过或低于均失败。
# 每行注释为逐规则违规处数快照（ruff check --isolated 机械核对，合计 10），
# 须与脚本中 BASELINE_VIOLATIONS 保持一致。
"database-analysis/database.py" = ["ANN201"]                        # 快照: ANN201=1
"database-analysis/gui_app.py" = ["PLR0915"]                        # 快照: PLR0915=1
"database-analysis/log_parser.py" = ["PLR0915"]                     # 快照: PLR0915=2
"upper computer/router/gateway.py" = ["ANN001", "PLR0915"]          # 快照: ANN001=3, PLR0915=1
"upper computer/ui/components.py" = ["ANN001"]                      # 快照: ANN001=2
